<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shot On Me — Cinematic Promo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif;color:#fff;padding:20px}
canvas{max-width:min(92vw,1280px);height:auto;border-radius:8px;box-shadow:0 0 100px rgba(0,0,0,.9)}
.ctrls{display:flex;gap:14px;margin:20px 0 8px}
.btn{padding:13px 36px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .15s;display:flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.btn-p{background:linear-gradient(135deg,#B8945A,#C9A875);color:#000}
.btn-d{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000}
.btn:disabled{background:#181818!important;color:#444!important;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.st{font-size:12px;color:#555;letter-spacing:1px;text-align:center}
.pb{width:min(92vw,1280px);height:3px;background:#111;border-radius:2px;margin-top:10px;overflow:hidden}
.pf{height:100%;width:0;background:linear-gradient(90deg,#B8945A,#C8F135,#0ea5e9);border-radius:2px;transition:width .05s linear}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="pb"><div class="pf" id="prog"></div></div>
<div class="ctrls">
  <button class="btn btn-p" id="pBtn" onclick="doPreview()">&#9654; Preview</button>
  <button class="btn btn-d" id="dBtn" onclick="doDownload()">&#11015; Download .webm</button>
</div>
<div class="st" id="st">Loading...</div>

<script>
const W=1920,H=1080,CX=W/2,CY=H/2;
const X=document.getElementById('c').getContext('2d');
const progEl=document.getElementById('prog'),stEl=document.getElementById('st');

// PALETTE
const G='#B8945A',GL='#C9A875',GD='#A7782D';
const LM='#C8F135',CF='#00D4FF',RF='#FF5F57';
const CY2='#0ea5e9',GR='#22c55e',BL='#3b82f6',YL='#fbbf24',PU='#a855f7',RS='#f43f5e',AM='#f59e0b';
const BG='#000',DK='#111',FBG='#1A1A2E',FC='#252540';

// TIMING — ~95 seconds total, generous per-screen time
const SC=[
  {s:0,e:5000},         // 0: title
  {s:5000,e:25000},     // 1: SOM (5 screens, 4s each)
  {s:25000,e:45000},    // 2: Revig (5 screens, 4s each)
  {s:45000,e:65000},    // 3: Venue Portal (5 screens, 4s each)
  {s:65000,e:85000},    // 4: Owner Portal (5 screens, 4s each)
  {s:85000,e:92000},    // 5: All four
  {s:92000,e:97000},    // 6: Outro
];
const TOT=97000,FD=500;

// MATH
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lp=(a,b,t)=>a+(b-a)*t;
const eO=t=>1-Math.pow(1-t,3);
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eB=t=>{const n=7.5625,d=2.75;let t2=t;if(t2<1/d)return n*t2*t2;if(t2<2/d)return n*(t2-=1.5/d)*t2+.75;if(t2<2.5/d)return n*(t2-=2.25/d)*t2+.9375;return n*(t2-=2.625/d)*t2+.984375}; // bounce
const fi=(el,st,d)=>eIO(cl((el-st)/d));
const fo=(el,st,d)=>1-eIO(cl((el-st)/d));
function sa(el,sc){const d=sc.e-sc.s,t=el-sc.s;let a=1;if(t<FD)a=eIO(t/FD);if(t>d-FD)a=eIO((d-t)/FD);return cl(a)}

// DRAW
function rr(x,y,w,h,r){X.beginPath();if(r>w/2)r=w/2;if(r>h/2)r=h/2;X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function fR(x,y,w,h,r,c){X.fillStyle=c;rr(x,y,w,h,r);X.fill()}
function sR(x,y,w,h,r,c,lw=1){X.strokeStyle=c;X.lineWidth=lw;rr(x,y,w,h,r);X.stroke()}
function tx(s,x,y,f,c,al='left',bl='top'){X.fillStyle=c;X.font=f;X.textAlign=al;X.textBaseline=bl;X.fillText(s,x,y)}
function ci(x,y,r,c){X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill()}
function lg(x1,y1,x2,y2,st){const g=X.createLinearGradient(x1,y1,x2,y2);st.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function rg(cx,cy,r,st){const g=X.createRadialGradient(cx,cy,0,cx,cy,r);st.forEach(s=>g.addColorStop(s[0],s[1]));return g}

// PARTICLES
const pts=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,vy:-15-Math.random()*30,sz:1+Math.random()*3,op:.1+Math.random()*.25,ph:Math.random()*6.28}));
function drawP(el,col,int=1){pts.forEach(p=>{const t=el/1000;const px=p.x+Math.sin(t*.5+p.ph)*50;const py=((p.y+p.vy*t)%H+H)%H;X.globalAlpha=p.op*int*(.5+.5*Math.sin(t*2+p.ph));ci(px,py,p.sz,col)});X.globalAlpha=1}

// LIGHT FLARE
function flare(x,y,sz,col,el){
  const g=rg(x,y,sz,[[0,col+'44'],[.3,col+'11'],[1,'transparent']]);
  X.fillStyle=g;X.fillRect(x-sz,y-sz,sz*2,sz*2);
  // horizontal streak
  X.fillStyle=lg(x-sz*2,y,x+sz*2,y,[[0,'transparent'],[.4,col+'15'],[.5,col+'22'],[.6,col+'15'],[1,'transparent']]);
  X.fillRect(x-sz*2,y-2,sz*4,4);
}

// PHONE FRAME
const PW=310,PH=650,PPX=-PW/2,PPY=-PH/2+20;
function phoneFrame(px,py,sc,glow){
  X.save();X.translate(px,py);X.scale(sc,sc);
  const w=340,h=700,r=44;
  X.shadowColor=glow;X.shadowBlur=45;
  fR(-w/2,-h/2,w,h,r,'#0c0c0c');X.shadowBlur=0;
  // bezel gradient
  sR(-w/2,-h/2,w,h,r,lg(-w/2,-h/2,w/2,h/2,[[0,'#666'],[.3,'#333'],[.7,'#333'],[1,'#666']]),2.5);
  // dynamic island
  fR(-52,-h/2+10,104,28,14,BG);
  // camera dot
  ci(20,-h/2+24,4,'#1a1a2e');ci(20,-h/2+24,2,'#0c2040');
  // home indicator
  fR(-50,h/2-22,100,4,2,'#444');
  // screen reflection (moving)
  X.globalAlpha=.025;
  X.fillStyle=lg(-w/2,-h/2,w/2,h/2,[[0,'#fff'],[.4,'transparent'],[.6,'transparent'],[1,'#fff']]);
  X.fillRect(-w/2,-h/2,w,h);
  X.globalAlpha=1;
  X.restore();
}

// STATUS BAR on phone
function statusBar(bg,accent){
  fR(PPX,PPY-16,PW,16,0,bg);
  tx('9:41',PPX+8,PPY-14,'600 9px Inter,sans-serif',accent||'#fff','left','top');
  // signal bars
  for(let i=0;i<4;i++){const bh=4+i*2;fR(PPX+PW-56+i*6,PPY-6-bh,4,bh,1,accent||'#fff');}
  // wifi
  tx('\u25CF',PPX+PW-30,PPY-14,'7px Inter,sans-serif',accent||'#fff','center','top');
  // battery
  fR(PPX+PW-22,PPY-12,16,8,2,'transparent');sR(PPX+PW-22,PPY-12,16,8,2,accent||'#fff',.5);
  fR(PPX+PW-20,PPY-10,11,4,1,accent||GR);
}

// LAPTOP FRAME
const LW=930,LH=555,LTB=34;
function laptopFrame(lx,ly,sc){
  X.save();X.translate(lx,ly);X.scale(sc,sc);
  const w=960,h=600,r=12;
  X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=50;
  fR(-w/2,-h/2,w,h,r,'#0c0c0c');X.shadowBlur=0;
  sR(-w/2,-h/2,w,h,r,'#555',2);
  fR(-w/2,-h/2,w,34,0,'#161616');
  ci(-w/2+18,-h/2+17,5,'#ff5f57');ci(-w/2+36,-h/2+17,5,'#febc2e');ci(-w/2+54,-h/2+17,5,'#28c840');
  fR(-w/2-30,h/2,w+60,8,4,'#1a1a1a');
  // subtle hinge
  X.fillStyle=lg(-w/2-30,h/2,w/2+30,h/2+8,[[0,'#222'],[.5,'#333'],[1,'#222']]);
  X.fillRect(-w/2-30,h/2,w+60,2);
  X.restore();
}

// ANIMATED TYPING
function typeText(full,el,start,dur){
  const t=cl((el-start)/dur);
  return full.substring(0,Math.floor(full.length*t));
}
// CURSOR BLINK
function cursor(x,y,h2,col,el){
  if(Math.floor(el/500)%2===0){X.fillStyle=col;X.fillRect(x,y,2,h2);}
}

// COUNTER
function ctr(val,el,start,dur){return Math.round(val*eO(cl((el-start)/dur)));}

// NOTIFICATION BADGE POP
function badge(x,y,count,col,el,start){
  const t=cl((el-start)/200);
  const sc=eB(t);
  if(sc<.01)return;
  X.save();X.translate(x,y);X.scale(sc,sc);
  ci(0,0,9,col);tx(''+count,0,0,'700 8px Inter,sans-serif','#000','center','middle');
  X.restore();
}

// SLIDE-IN ELEMENT
function slideIn(el,start,dur,fromX,fromY){
  const t=eO(cl((el-start)/dur));
  return {x:lp(fromX,0,t),y:lp(fromY,0,t),a:t};
}

// =============================================
//  SCENE 0: CINEMATIC TITLE
// =============================================
function s0(el){
  const t=el-SC[0].s;
  X.fillStyle=rg(CX,CY,700,[[0,'#1a1408'],[1,BG]]);X.fillRect(0,0,W,H);
  drawP(el,G,.3*fi(t,0,1500));
  // lens flare
  const fla=fi(t,200,800);
  if(fla>0)flare(CX,CY-30,200*fla,G,el);
  // logo
  const ls=fi(t,0,600);
  const ov=ls<1?1+.08*Math.sin(ls*Math.PI):1;
  X.save();X.translate(CX,CY-30);X.scale((.6+.4*ls)*ov,(.6+.4*ls)*ov);X.globalAlpha=ls;
  X.shadowColor=G+'77';X.shadowBlur=80;
  tx('Shot On Me',0,0,'700 130px "Dancing Script",cursive',G,'center','middle');
  X.shadowBlur=0;X.restore();X.globalAlpha=1;
  // sweep line
  const sw=fi(t,400,500);
  const lw2=500*sw;
  X.fillStyle=lg(CX-lw2/2,0,CX+lw2/2,0,[[0,'transparent'],[.3,G+'aa'],[.5,G],[.7,G+'aa'],[1,'transparent']]);
  X.fillRect(CX-lw2/2,CY+38,lw2,2);
  // tagline
  X.globalAlpha=fi(t,600,500);
  tx('SEND MONEY  \u00B7  SHARE MOMENTS',CX,CY+60,'300 28px Inter,sans-serif',GL,'center','top');
  X.globalAlpha=1;
  // flash
  if(t<100){X.globalAlpha=(1-t/100)*.15;X.fillStyle='#fff';X.fillRect(0,0,W,H);X.globalAlpha=1;}
}

// =============================================
//  SOM SCREEN RENDERERS (with micro-animations)
// =============================================
function somLogin(a,el,st){
  const t=el-st;
  X.globalAlpha=a;
  fR(PPX,PPY,PW,PH,0,'#080604');
  statusBar('#080604',G);
  // Hero
  tx('THE NIGHTLIFE SOCIAL APP',0,PPY+20,'600 8px Inter,sans-serif',G,'center','top');
  tx('Shot On Me',0,PPY+36,'700 32px "Dancing Script",cursive',G,'center','top');
  X.fillStyle=lg(-40,0,40,0,[[0,'transparent'],[.5,G+'88'],[1,'transparent']]);X.fillRect(-40,PPY+74,80,1);
  tx('Buy someone a drink.',0,PPY+84,'400 11px Inter,sans-serif','#ccc','center','top');
  tx('Make a night to remember.',0,PPY+98,'400 11px Inter,sans-serif',G,'center','top');
  // Social proof
  const spa=fi(t,300,400);X.globalAlpha=a*spa;
  fR(PPX+40,PPY+118,PW-80,22,11,G+'15');sR(PPX+40,PPY+118,PW-80,22,11,G+'33');
  tx('\uD83D\uDC65 2,400+ shots sent this week',0,PPY+129,'600 8px Inter,sans-serif',GL,'center','middle');
  X.globalAlpha=a;
  // 3 feature cards
  const feats=[
    {ic:'\uD83C\uDF7B',t2:'Send a drink to anyone',d:'Buy a round or surprise a stranger — all from your phone.'},
    {ic:'\uD83D\uDCCD',t2:'Discover where to be',d:'See which venues your crew is at and what\'s happening now.'},
    {ic:'\u2728',t2:'Make every night a story',d:'Check in, connect, and share the moments that matter.'},
  ];
  feats.forEach((f,i)=>{
    const fa=fi(t,500+i*250,400);X.globalAlpha=a*fa;
    const fy=PPY+152+i*68;
    fR(PPX+10,fy,PW-20,60,10,DK);sR(PPX+10,fy,PW-20,60,10,G+'22');
    tx(f.ic,PPX+28,fy+22,'18px "Segoe UI Emoji",sans-serif','#fff','center','middle');
    tx(f.t2,PPX+44,fy+8,'600 10px Inter,sans-serif','#eee','left','top');
    tx(f.d,PPX+44,fy+22,'400 8px Inter,sans-serif','#999','left','top');
    // wrap second line if needed
    const words=f.d.split(' ');const mid=Math.ceil(words.length/2);
    tx(words.slice(0,mid).join(' '),PPX+44,fy+22,'400 8px Inter,sans-serif','#999','left','top');
    tx(words.slice(mid).join(' '),PPX+44,fy+34,'400 8px Inter,sans-serif','#999','left','top');
  });
  X.globalAlpha=a;
  // Venue discovery section
  const vda=fi(t,1400,500);X.globalAlpha=a*vda;
  tx('\uD83D\uDCCD Discover Venues',PPX+12,PPY+366,'600 10px Inter,sans-serif',G,'left','top');
  tx('Works at any tap & pay venue',PPX+12,PPY+380,'300 8px Inter,sans-serif','#888','left','top');
  // City chips scrolling
  const cities=['All','Indianapolis','Chicago','Louisville','Nashville','Detroit'];
  cities.forEach((c,i)=>{
    const cx2=PPX+10+i*52-(t/15)%50;
    if(cx2>PPX-20&&cx2<PPX+PW+20){
      fR(cx2,PPY+396,48,18,9,i===0?G+'33':'#1a1a1a');tx(c,cx2+24,PPY+405,'500 7px Inter,sans-serif',i===0?G:'#888','center','middle');
    }
  });
  // Venue cards
  [{n:'The Rooftop Bar',cat:'Bar',loc:'Downtown'},{n:'Brewhouse Tavern',cat:'Restaurant',loc:'Broad Ripple'},{n:'Club Luxe',cat:'Nightclub',loc:'Mass Ave'}].forEach((v,i)=>{
    const vx=PPX+10+i*100;
    fR(vx,PPY+420,94,78,8,DK);sR(vx,PPY+420,94,78,8,G+'15');
    fR(vx,PPY+420,94,36,8,'#1a1a1a');tx('\uD83C\uDFDB\uFE0F',vx+47,PPY+438,'16px "Segoe UI Emoji",sans-serif','#555','center','middle');
    tx(v.n,vx+6,PPY+462,'600 7px Inter,sans-serif','#eee','left','top');
    tx(v.loc,vx+6,PPY+474,'400 6px Inter,sans-serif','#888','left','top');
    fR(vx+6,PPY+484,36,12,6,G+'22');tx(v.cat,vx+24,PPY+490,'500 6px Inter,sans-serif',G,'center','middle');
  });
  X.globalAlpha=a;
  // footer
  tx('Available at any tap & pay venue',0,PPY+510,'300 7px Inter,sans-serif','#666','center','top');
  tx('IN \u00B7 IL \u00B7 KY \u00B7 TN \u00B7 MI \u00B7 OH',0,PPY+522,'600 7px Inter,sans-serif','#888','center','top');
  // Get Started button
  fR(PPX+16,PPY+540,PW-32,36,10,G);tx('Get Started',0,PPY+558,'700 13px Inter,sans-serif','#000','center','middle');
  somNav(-1);
  X.globalAlpha=1;
}
function somHome(a,el,st){
  const t=el-st;
  X.globalAlpha=a;
  fR(PPX,PPY,PW,PH,0,'#080604');
  statusBar('#080604',G);
  tx('Shot On Me',0,PPY+12,'700 22px "Dancing Script",cursive',G,'center','top');
  // wallet — glow pulse
  const wy=PPY+42;
  const gp=.3+.1*Math.sin(el/400);
  X.shadowColor=G;X.shadowBlur=15*gp;
  fR(PPX+8,wy,PW-16,78,14,lg(PPX,wy,PPX+PW,wy+78,[[0,'#1a1408'],[1,'#0d0b06']]));
  X.shadowBlur=0;sR(PPX+8,wy,PW-16,78,14,G+'55');
  tx('AVAILABLE BALANCE',0,wy+12,'600 9px Inter,sans-serif','#888','center','top');
  // animated counter
  const bal='$'+ctr(24750,t,0,600)/100;
  tx(bal.includes('.')?bal:bal+'.00',0,wy+28,'900 32px Inter,sans-serif',G,'center','top');
  // tap to pay with shimmer
  const shimX=(t/10)%200-100;
  X.save();rr(PPX+8,wy+60,PW-16,16,8);X.clip();
  tx('\uD83D\uDCB3 Tap to Pay Ready',0,wy+62,'600 8px Inter,sans-serif',G+'88','center','top');
  X.fillStyle=lg(shimX-20,0,shimX+20,0,[[0,'transparent'],[.5,G+'22'],[1,'transparent']]);
  X.fillRect(PPX+8,wy+60,PW-16,16);
  X.restore();
  // deals — stagger in from right
  tx('\uD83D\uDD25 LIVE DEALS NEAR YOU',PPX+12,wy+90,'700 10px Inter,sans-serif',G,'left','top');
  const deals=[{n:'Half-Price Margaritas',v:'The Rooftop Bar',b:'Happy Hour',c:AM},{n:'$5 Craft Beers',v:'Brewhouse Tavern',b:'Flash Deal',c:RS},{n:'VIP Bottle Service',v:'Club Luxe',b:'VIP',c:PU},{n:'2-for-1 Cocktails',v:'Skyline Lounge',b:'Happy Hour',c:AM}];
  deals.forEach((d,i)=>{
    const sl=slideIn(t,200+i*120,300,60,0);
    X.globalAlpha=a*sl.a;X.save();X.translate(sl.x,0);
    const dy=wy+108+i*44;
    fR(PPX+8,dy,PW-16,38,8,DK);sR(PPX+8,dy,PW-16,38,8,G+'15');
    tx(d.n,PPX+18,dy+8,'600 11px Inter,sans-serif','#eee','left','top');
    tx('\uD83D\uDCCD '+d.v,PPX+18,dy+23,'9px Inter,sans-serif','#777','left','top');
    fR(PPX+PW-80,dy+10,64,18,9,d.c+'22');tx(d.b,PPX+PW-48,dy+19,'600 8px Inter,sans-serif',d.c,'center','middle');
    X.restore();
  });
  X.globalAlpha=a;
  // friends — slide up
  const fsl=slideIn(t,800,300,0,40);
  X.globalAlpha=a*fsl.a;X.save();X.translate(0,fsl.y);
  tx('\uD83D\uDC65 FRIENDS NEARBY',PPX+12,wy+288,'700 10px Inter,sans-serif',G,'left','top');
  [{n:'Sarah K.',d:'0.2 mi',v:'The Rooftop Bar'},{n:'Jake M.',d:'0.5 mi',v:'Brewhouse Tavern'}].forEach((f,i)=>{
    const ffy=wy+306+i*38;fR(PPX+8,ffy,PW-16,32,8,DK);sR(PPX+8,ffy,PW-16,32,8,G+'15');
    ci(PPX+24,ffy+16,10,G+'44');tx(f.n.charAt(0),PPX+24,ffy+16,'700 9px Inter,sans-serif',G,'center','middle');
    tx(f.n+' \u2022 '+f.d,PPX+38,ffy+7,'600 10px Inter,sans-serif','#eee','left','top');
    tx('\uD83D\uDCCD '+f.v,PPX+38,ffy+20,'8px Inter,sans-serif','#777','left','top');
    tx('Send \u2192',PPX+PW-18,ffy+14,'600 9px Inter,sans-serif',G,'right','top');
  });
  X.restore();X.globalAlpha=a;
  somNav(0);X.globalAlpha=1;
}
function somWallet(a,el,st){
  const t=el-st;
  X.globalAlpha=a;
  fR(PPX,PPY,PW,PH,0,'#080604');statusBar('#080604',G);
  tx('\uD83D\uDCB0 Wallet',PPX+12,PPY+12,'700 18px Inter,sans-serif','#fff','left','top');
  const by=PPY+48;
  X.shadowColor=G+'33';X.shadowBlur=20;
  fR(PPX+8,by,PW-16,100,16,lg(PPX,by,PPX+PW,by+100,[[0,'#1a1408'],[1,'#0d0b06']]));
  X.shadowBlur=0;sR(PPX+8,by,PW-16,100,16,G+'44');
  tx('Available Balance',0,by+14,'400 11px Inter,sans-serif','#888','center','top');
  const bal2='$'+ctr(24750,t,0,500)/100;
  tx(bal2.includes('.')?bal2:bal2+'.00',0,by+34,'900 38px Inter,sans-serif',G,'center','top');
  // pending counter
  tx('Pending: $'+(ctr(2500,t,200,400)/100).toFixed(2),0,by+78,'400 10px Inter,sans-serif','#666','center','top');
  // send form
  const fsl=slideIn(t,300,400,0,50);X.globalAlpha=a*fsl.a;X.save();X.translate(0,fsl.y);
  tx('SEND A DRINK',PPX+12,by+118,'700 11px Inter,sans-serif',G,'left','top');
  const sy=by+136;

// =============================================
//  COLLAGE SCENE ORCHESTRATOR
//  Renders one screen large + previous screens as thumbnails
// =============================================
const TRANS_IN=600,SHRINK_DUR=500,PER_SCREEN=4000;

// Phone collage: screens build up, large centered + thumbs at bottom
function phoneCollage(el,sceneStart,screens,labels,accentCol,glowCol){
  const t=el-sceneStart;
  const curIdx=Math.min(Math.floor(t/PER_SCREEN),screens.length-1);
  const tInSlot=t-curIdx*PER_SCREEN;
  const thumbScale=0.35;
  const largeScale=1.6;
  const thumbY=H-120;

  // Draw thumbnails (all previous screens)
  const thumbCount=curIdx; // number of completed screens
  if(thumbCount>0){
    const spacing=Math.min(140, (W-200)/thumbCount);
    const totalW=spacing*(thumbCount-1);
    const startX=CX-totalW/2;
    for(let i=0;i<thumbCount;i++){
      // animate shrink if this just became a thumbnail
      let sc=thumbScale;
      let tx2=startX+i*spacing;
      let ty2=thumbY;
      let alpha=0.85;
      if(i===curIdx-1 && tInSlot<SHRINK_DUR){
        // transitioning from large to thumbnail
        const p=eIO(tInSlot/SHRINK_DUR);
        sc=lp(largeScale,thumbScale,p);
        tx2=lp(CX,startX+i*spacing,p);
        ty2=lp(CY+20,thumbY,p);
        alpha=lp(1,0.85,p);
      }
      X.save();
      X.globalAlpha=alpha;
      phoneFrame(tx2,ty2,sc,glowCol+'22');
      X.translate(tx2,ty2);X.scale(sc,sc);
      screens[i](1,el,sceneStart+i*PER_SCREEN);
      X.restore();
      // label under thumbnail
      X.globalAlpha=i===curIdx-1&&tInSlot<SHRINK_DUR?eIO(tInSlot/SHRINK_DUR)*0.7:0.7;
      tx(labels[i],tx2,ty2+thumbScale*700/2+14,'600 11px Inter,sans-serif',accentCol,'center','top');
      X.globalAlpha=1;
    }
  }

  // Draw the current large screen
  {
    const fadeIn=eIO(cl(tInSlot/TRANS_IN));
    const scaleIn=lp(0.9,1,eO(cl(tInSlot/TRANS_IN)));
    X.save();
    X.globalAlpha=fadeIn;
    const sc=largeScale*scaleIn;
    phoneFrame(CX,CY+20,sc,glowCol+'44');
    X.translate(CX,CY+20);X.scale(sc,sc);
    screens[curIdx](1,el,sceneStart+curIdx*PER_SCREEN);
    X.restore();
    X.globalAlpha=1;
  }
}

// Laptop collage: screens build up, large centered + thumbs at bottom
function laptopCollage(el,sceneStart,screens,labels,accentCol){
  const t=el-sceneStart;
  const curIdx=Math.min(Math.floor(t/PER_SCREEN),screens.length-1);
  const tInSlot=t-curIdx*PER_SCREEN;
  const thumbScale=0.3;
  const largeScale=1.2;
  const thumbY=H-100;

  // Draw thumbnails (all previous screens)
  const thumbCount=curIdx;
  if(thumbCount>0){
    const spacing=Math.min(200, (W-200)/thumbCount);
    const totalW=spacing*(thumbCount-1);
    const startX=CX-totalW/2;
    for(let i=0;i<thumbCount;i++){
      let sc=thumbScale;
      let tx2=startX+i*spacing;
      let ty2=thumbY;
      let alpha=0.8;
      if(i===curIdx-1 && tInSlot<SHRINK_DUR){
        const p=eIO(tInSlot/SHRINK_DUR);
        sc=lp(largeScale,thumbScale,p);
        tx2=lp(CX,startX+i*spacing,p);
        ty2=lp(CY+30,thumbY,p);
        alpha=lp(1,0.8,p);
      }
      X.save();
      X.globalAlpha=alpha;
      laptopFrame(tx2,ty2,sc);
      X.translate(tx2,ty2);X.scale(sc,sc);
      screens[i](1,el,sceneStart+i*PER_SCREEN);
      X.restore();
      X.globalAlpha=i===curIdx-1&&tInSlot<SHRINK_DUR?eIO(tInSlot/SHRINK_DUR)*0.65:0.65;
      tx(labels[i],tx2,ty2+thumbScale*600/2+14,'600 11px Inter,sans-serif',accentCol,'center','top');
      X.globalAlpha=1;
    }
  }

  // Draw the current large screen
  {
    const fadeIn=eIO(cl(tInSlot/TRANS_IN));
    const scaleIn=lp(0.9,1,eO(cl(tInSlot/TRANS_IN)));
    X.save();
    X.globalAlpha=fadeIn;
    const sc=largeScale*scaleIn;
    laptopFrame(CX,CY+30,sc);
    X.translate(CX,CY+30);X.scale(sc,sc);
    // URL bar for laptops
    screens[curIdx](1,el,sceneStart+curIdx*PER_SCREEN);
    X.restore();
    X.globalAlpha=1;
  }
}
