# Render Blueprint Configuration
# This file can be used to deploy multiple services at once
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: shot-on-me-backend
    env: node
    plan: starter  # Free tier, upgrade to standard for better performance
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: CLOUDINARY_CLOUD_NAME
        value: djvgm2d3t
      - key: CLOUDINARY_API_KEY
        value: "873876397654419"
      - key: CLOUDINARY_API_SECRET
        value: 3NhIpV2TlkzqeRr5vsqXQUv6a0A
      - key: VERCEL_PROJECT_PATTERN
        value: shot-on-me
