<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8F135;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <!-- Main bubble -->
  <circle cx="100" cy="105" r="42" fill="#1A1A2E" opacity="0.85"/>
  <!-- Bubble shine -->
  <circle cx="88" cy="90" r="10" fill="white" opacity="0.25"/>
  <!-- Small bubbles rising -->
  <circle cx="100" cy="52" r="10" fill="#1A1A2E" opacity="0.75"/>
  <circle cx="92" cy="40" r="6" fill="#1A1A2E" opacity="0.6"/>
  <circle cx="108" cy="38" r="4" fill="#1A1A2E" opacity="0.5"/>
  <!-- Fizz dots inside main bubble -->
  <circle cx="92" cy="108" r="4" fill="#C8F135" opacity="0.9"/>
  <circle cx="104" cy="102" r="3" fill="#00D4FF" opacity="0.9"/>
  <circle cx="110" cy="114" r="5" fill="#FF5F57" opacity="0.8"/>
  <circle cx="96" cy="118" r="2.5" fill="#C8F135" opacity="0.7"/>
</svg>
