<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#2E2E50"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8F135"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow orbs -->
  <circle cx="150" cy="150" r="200" fill="#C8F135" opacity="0.05"/>
  <circle cx="1100" cy="500" r="250" fill="#FF5F57" opacity="0.06"/>
  <circle cx="600" cy="600" r="180" fill="#00D4FF" opacity="0.05"/>
  <!-- Logo mark -->
  <circle cx="200" cy="315" r="80" fill="#C8F135" opacity="0.15"/>
  <circle cx="200" cy="315" r="58" fill="#1A1A2E" opacity="0.9"/>
  <circle cx="200" cy="255" r="18" fill="#C8F135" opacity="0.8"/>
  <circle cx="200" cy="220" r="10" fill="#C8F135" opacity="0.6"/>
  <circle cx="186" cy="304" r="7" fill="#C8F135"/>
  <circle cx="200" cy="296" r="5" fill="#00D4FF"/>
  <circle cx="214" cy="310" r="8" fill="#FF5F57" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="320" y="350" font-family="system-ui, sans-serif" font-weight="900" font-size="140" fill="url(#lime)">Fizz</text>
  <!-- Tagline -->
  <text x="320" y="405" font-family="system-ui, sans-serif" font-weight="400" font-size="32" fill="rgba(255,255,255,0.5)">Send the moment. Find your spot.</text>
</svg>
